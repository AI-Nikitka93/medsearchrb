name: promo-sync

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Run all configured clinics or one selected clinic"
        type: choice
        options:
          - all
          - eclinic
          - medavenu
          - diagnostics
          - retry-medavenu
        default: all
        required: true
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: medsearchrb-promo-sync
  cancel-in-progress: false

jobs:
  promo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/worker/package-lock.json
            apps/miniapp/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm --prefix apps/worker ci --no-audit --prefer-offline

      - name: Run promo sources to batch file
        if: ${{ inputs.scope != 'diagnostics' && inputs.scope != 'retry-medavenu' }}
        env:
          MAX_DOCTORS_PER_SOURCE: "0"
          PROMO_SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          if [ "$PROMO_SCOPE" = "eclinic" ]; then
            sources=(eclinic)
          elif [ "$PROMO_SCOPE" = "medavenu" ]; then
            sources=(medavenu)
          else
            sources=(alphamed aquaminsk blossomclinic bullfinch centrsna dimeda doctortut eclinic eksana forestmed gurumed idealmed kaskad kravira lighthouse lifecity lode medart medavenu medera medexpert mercimed minskdentist mrtby neomedical nordin ortosmile paracels parodent sante shineest smartmedical supramed verba)
          fi
          python -m apps.scrapers.main \
            --sources "${sources[@]}" \
            --output-mode file \
            --log-level INFO

      - name: Backfill promo batch to Turso
        if: ${{ inputs.scope != 'diagnostics' && inputs.scope != 'retry-medavenu' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          INGEST_SHARED_SECRET: ${{ secrets.INGEST_SHARED_SECRET }}
        run: >
          npm --prefix apps/worker run catalog:backfill --
          --batch-file "$HOME/.local/share/MedsearchRB/scraper/batches/latest-source-batch.json"
          --chunk-size 50

      - name: Make recent MedAvenue delivery failures eligible for retry
        if: ${{ inputs.scope == 'retry-medavenu' }}
        working-directory: apps/worker
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { createClient } from "@libsql/client";

          const client = createClient({
            url: process.env.TURSO_DATABASE_URL,
            authToken: process.env.TURSO_AUTH_TOKEN,
          });
          const now = new Date().toISOString();
          const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
          const result = await client.execute({
            sql: `
              UPDATE notification_outbox
              SET next_attempt_at = ?
              WHERE event_type = 'promotion.updated'
                AND entity_type = 'promotion'
                AND status = 'failed'
                AND created_at >= ?
                AND entity_id IN (SELECT id FROM promotions WHERE source_name = 'medavenu')
            `,
            args: [now, since],
          });
          console.log(JSON.stringify({ eligibleMedAvenueRetries: Number(result.rowsAffected ?? 0) }));
          await client.close();
          JS

      - name: Flush promotion posts to Telegram channel
        if: ${{ inputs.scope != 'diagnostics' }}
        env:
          INGEST_SHARED_SECRET: ${{ secrets.INGEST_SHARED_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://medsearchrb-api.aiartnikitka93.workers.dev/internal/notifications/promotions/flush",
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['INGEST_SHARED_SECRET']}",
                  "Content-Type": "application/json",
                  "User-Agent": "MedsearchRB-GitHubActions/1.0",
              },
              data=b"{}",
          )

          with urllib.request.urlopen(request, timeout=120) as response:
              payload = json.loads(response.read().decode("utf-8"))
              print(json.dumps(payload, ensure_ascii=False))
          PY

      - name: Report recent promotion delivery retries
        if: ${{ inputs.scope == 'diagnostics' || success() }}
        working-directory: apps/worker
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { createClient } from "@libsql/client";

          const client = createClient({
            url: process.env.TURSO_DATABASE_URL,
            authToken: process.env.TURSO_AUTH_TOKEN,
          });
          const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
          const result = await client.execute({
            sql: `
              SELECT p.source_name, p.title, o.created_at, o.attempt_count, o.last_error, o.next_attempt_at
              FROM notification_outbox o
              JOIN promotions p ON p.id = o.entity_id
              WHERE o.event_type = 'promotion.updated'
                AND o.entity_type = 'promotion'
                AND o.status = 'failed'
                AND o.created_at >= ?
              ORDER BY o.created_at DESC
              LIMIT 20
            `,
            args: [since],
          });
          const failures = result.rows.map((row) => ({
            source: row.source_name,
            title: row.title,
            createdAt: row.created_at,
            attempts: Number(row.attempt_count ?? 0),
            nextAttemptAt: row.next_attempt_at,
            reason: String(row.last_error ?? "").replace(
              /https:\/\/api\.telegram\.org\/bot[^/\s]+|bot\d+:[A-Za-z0-9_-]+/giu,
              "[redacted]",
            ).slice(0, 300),
          }));
          console.log(JSON.stringify({ recentFailedDeliveries: failures }, null, 2));
          await client.close();
          JS

      - name: Verify live promo total
        if: ${{ inputs.scope != 'diagnostics' && inputs.scope != 'retry-medavenu' }}
        run: |
          python - <<'PY'
          import json
          import urllib.request

          request = urllib.request.Request(
              "https://medsearchrb-api.aiartnikitka93.workers.dev/api/v1/promotions?page=1&per_page=1",
              headers={"User-Agent": "MedsearchRB-GitHubActions/1.0"},
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))
              print(json.dumps({"total": payload["total"]}, ensure_ascii=False))
          PY

      - name: Skip Mini App publish
        if: ${{ inputs.scope != 'diagnostics' && inputs.scope != 'retry-medavenu' }}
        run: |
          echo "Mini App publish is intentionally decoupled from promo sync to protect the stable gh-pages release."

      - name: Upload promo batch artifact
        if: ${{ inputs.scope != 'diagnostics' && inputs.scope != 'retry-medavenu' }}
        uses: actions/upload-artifact@v4
        with:
          name: promo-source-batch
          path: ~/.local/share/MedsearchRB/scraper/batches/latest-source-batch.json
          if-no-files-found: warn
          retention-days: 3
