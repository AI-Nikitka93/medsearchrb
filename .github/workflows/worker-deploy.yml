name: worker-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/worker-deploy.yml"
      - "apps/worker/**"
      - "db/migrations/**"

permissions:
  contents: read

concurrency:
  group: medsearchrb-worker-deploy
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      INGEST_SHARED_SECRET: ${{ secrets.INGEST_SHARED_SECRET }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
      PRIVACY_URL: ${{ secrets.PRIVACY_URL }}
      SUPPORT_USERNAME: ${{ secrets.SUPPORT_USERNAME }}
      BOT_DESCRIPTION: ${{ secrets.BOT_DESCRIPTION }}
      BOT_SHORT_DESCRIPTION: ${{ secrets.BOT_SHORT_DESCRIPTION }}
      TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required deploy secrets
        shell: bash
        run: |
          required=(
            TURSO_DATABASE_URL
            TURSO_AUTH_TOKEN
            INGEST_SHARED_SECRET
            BOT_TOKEN
            TELEGRAM_CHANNEL_ID
            WEBAPP_URL
            PRIVACY_URL
            SUPPORT_USERNAME
            BOT_DESCRIPTION
            BOT_SHORT_DESCRIPTION
          )

          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing GitHub secrets for worker deploy: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Validate Cloudflare deploy credentials
        shell: bash
        run: |
          failed=0

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            printf '[ERROR] CLOUDFLARE_API_TOKEN is not configured. Please set the secret in your environment.\n' >&2
            failed=1
          else
            response="$(curl -sS -w '\n%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
            http_code="${response##*$'\n'}"
            body="${response%$'\n'*}"

            if [ "$http_code" != "200" ] || ! grep -q '"success":true' <<< "$body"; then
              if grep -q '"code":9109' <<< "$body"; then
                printf '[ERROR] GitHub secret CLOUDFLARE_API_TOKEN is invalid or revoked. Cloudflare returned code 9109. Replace the secret with a scoped API token for this account.\n' >&2
              else
                printf '[ERROR] Cloudflare API token validation failed before deploy. HTTP %s\n%s\n' "$http_code" "$body" >&2
              fi
              failed=1
            fi
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            printf '[ERROR] CLOUDFLARE_ACCOUNT_ID is not configured. Add it as a GitHub secret for non-interactive Wrangler deploys.\n' >&2
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
              printf '[HINT] The token must be allowed to deploy Workers and write Worker secrets for the target account.\n' >&2
            else
              printf '[HINT] Required GitHub secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.\n' >&2
            fi
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/worker/package-lock.json

      - name: Install Worker dependencies
        run: npm --prefix apps/worker ci --no-audit --prefer-offline

      - name: Typecheck Worker
        run: npm --prefix apps/worker run check

      - name: Apply Turso migrations
        run: npm --prefix apps/worker run db:migrate

      - name: Sync Worker runtime secrets
        shell: bash
        working-directory: apps/worker
        run: |
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            fi
          }

          put_secret TURSO_DATABASE_URL "$TURSO_DATABASE_URL"
          put_secret TURSO_AUTH_TOKEN "$TURSO_AUTH_TOKEN"
          put_secret INGEST_SHARED_SECRET "$INGEST_SHARED_SECRET"
          put_secret BOT_TOKEN "$BOT_TOKEN"
          put_secret TELEGRAM_CHANNEL_ID "$TELEGRAM_CHANNEL_ID"
          put_secret WEBAPP_URL "$WEBAPP_URL"
          put_secret PRIVACY_URL "$PRIVACY_URL"
          put_secret SUPPORT_USERNAME "$SUPPORT_USERNAME"
          put_secret BOT_DESCRIPTION "$BOT_DESCRIPTION"
          put_secret BOT_SHORT_DESCRIPTION "$BOT_SHORT_DESCRIPTION"
          put_secret TELEGRAM_CHANNEL_USERNAME "$TELEGRAM_CHANNEL_USERNAME"

          if [ -n "$TELEGRAM_WEBHOOK_SECRET" ]; then
            put_secret TELEGRAM_WEBHOOK_SECRET "$TELEGRAM_WEBHOOK_SECRET"
          else
            put_secret TELEGRAM_WEBHOOK_SECRET "$INGEST_SHARED_SECRET"
          fi

          put_secret GROQ_API_KEY "$GROQ_API_KEY"

      - name: Deploy Worker
        working-directory: apps/worker
        run: npx wrangler deploy
